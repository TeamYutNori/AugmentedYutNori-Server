spring.application.name=AugmentedYutNori-Server


# Server (순간 접속 폭주 대비: 처리 대기열 크기)
server.tomcat.accept-count=1000

# DB
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:3306/yutnori?createDatabaseIfNotExist=true&serverTimezone=Asia/Seoul&characterEncoding=UTF-8
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.hikari.maximum-pool-size=30
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# Redis
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}

# Game
yutnori.game.max-players=4
yutnori.game.pieces-per-team=4
yutnori.game.turn-time-limit=30s
yutnori.game.augment-choice-count=3
yutnori.game.augment-select-time-limit=20s
yutnori.game.reconnect-grace=30s

# WebSocket
yutnori.ws.path=/ws/rooms/*
yutnori.ws.allowed-origins=https://*.itch.zone,http://localhost:*
yutnori.ws.ping-interval=10s

# JSON (클라 MessageSerializer와 동일하게 null 필드 생략)
spring.jackson.default-property-inclusion=non_null

# Firebase
yutnori.firebase.credentials-path=${FIREBASE_CREDENTIALS_PATH}

# CORS (HTTP API 허용 출처, 쉼표로 구분)
yutnori.cors.allowed-origins=https://*.itch.zone,http://localhost:*

# 앞단(nginx 등)이 붙여 주는 X-Forwarded-* 헤더를 믿어서 원래 요청이 https였다는 걸 알게 함
server.forward-headers-strategy=framework

# 오래된 계정 정리 (구글·게스트 모두): 마지막 접속이 N일 지난 계정 삭제, 실행 시각 (서울 기준 Spring cron: 초 분 시 일 월 요일)
guest.cleanup.inactive-days=30
guest.cleanup.cron=0 0 4 * * *

# 게임 결과 보상: 이 라운드(남은 사람이 모두 한 번씩 차례를 도는 것)가 끝나기 전에(증강 선택 중 포함) 나간 사람은 보상 인원에서 뺀다
# 5 = 다섯 번째 바퀴가 끝나기 전까지 나가면 보상 인원에서 뺀다
reward.early-leave-rounds=5
