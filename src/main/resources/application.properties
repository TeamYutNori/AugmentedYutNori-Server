spring.application.name=AugmentedYutNori-Server


# DB
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:3306/yutnori?createDatabaseIfNotExist=true&serverTimezone=Asia/Seoul&characterEncoding=UTF-8
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# Redis
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}

# Game
yutnori.game.max-players=2
yutnori.game.pieces-per-team=2
yutnori.game.turn-time-limit=30s
yutnori.game.augment-choice-count=3
yutnori.game.augment-select-time-limit=20s
yutnori.game.reconnect-grace=30s

# WebSocket
yutnori.ws.path=/ws
yutnori.ws.allowed-origins=*
yutnori.ws.ping-interval=10s